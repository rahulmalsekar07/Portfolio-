<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Buy Product | UrbanDude</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#080b0f;color:#fff;min-height:100vh}header{padding:20px 7%;border-bottom:1px solid #252b31;display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:bold;color:#00d9ff}header a{color:#fff;text-decoration:none}.container{width:min(1000px,92%);margin:40px auto;display:grid;grid-template-columns:1fr 1.2fr;gap:30px}.card{background:#11151a;border:1px solid #292e35;border-radius:15px;padding:25px}.product-card{text-align:center}.product-card img{width:100%;height:420px;object-fit:cover;border-radius:12px;margin-bottom:20px}.product-card h1{font-size:28px;margin-bottom:12px}.price{font-size:25px;color:#00d9ff;font-weight:bold}h2{margin-bottom:20px;color:#00d9ff}label{display:block;margin:15px 0 7px;font-weight:bold}input,textarea{width:100%;padding:13px;border-radius:7px;border:1px solid #3a4148;background:#0b0e12;color:#fff;font-size:15px}textarea{min-height:110px;resize:vertical}.qty{display:flex;align-items:center;gap:12px}.qty button{width:42px;height:42px;border:1px solid #00d9ff;background:#11151a;color:#fff;border-radius:6px;font-size:20px;cursor:pointer}#quantity{width:65px;text-align:center}.total{margin-top:20px;padding:15px;border-top:1px solid #333;font-size:20px;display:flex;justify-content:space-between}.place{width:100%;margin-top:20px;padding:15px;border:0;border-radius:8px;background:#00d9ff;color:#061014;font-size:17px;font-weight:bold;cursor:pointer}.error{color:#ff6b6b;margin-top:12px;display:none}.popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);justify-content:center;align-items:center;padding:20px}.popup-box{width:min(500px,100%);background:#11151a;border:1px solid #00d9ff;border-radius:15px;padding:35px;text-align:center}.tick{font-size:55px;margin-bottom:12px}.popup-box h2{color:#00d9ff}.popup-box p{line-height:1.7;color:#c9cdd1}.popup-box button{margin-top:22px;padding:12px 25px;border:0;border-radius:7px;background:#00d9ff;font-weight:bold;cursor:pointer}@media(max-width:750px){.container{grid-template-columns:1fr}.product-card img{height:330px}}</style></head><body><header><div class="logo">UrbanDude</div><a href="product.html">← Back to Product</a></header><div class="container"><div class="card product-card"><img id="productImage" src="" alt="Selected Product"><h1 id="productName">Product</h1><div class="price">₹<span id="productPrice">0</span></div></div><div class="card"><h2>Buy Product</h2><label>Quantity</label><div class="qty"><button type="button" onclick="changeQty(-1)">−</button><input id="quantity" type="number" min="1" max="20" value="1"><button type="button" onclick="changeQty(1)">+</button></div><label>Full Name</label><input id="name" type="text" placeholder="Enter your full name"><label>Mobile Number</label><input id="mobile" type="tel" placeholder="Enter 10-digit mobile number"><label>Delivery Address</label><textarea id="address" placeholder="Enter house no., street, city, state and PIN code"></textarea><div class="total"><span>Total Amount</span><strong>₹<span id="total">0</span></strong></div><div id="error" class="error"></div><button class="place" type="button" onclick="placeOrder()">PLACE ORDER</button></div></div><div id="successPopup" class="popup"><div class="popup-box"><div class="tick">🎉</div><h2>Thank You!</h2><p id="successText"></p><button onclick="closePopup()">Continue Shopping</button></div></div><script>const p=new URLSearchParams(location.search),productName=p.get('product')||'UrbanDude Product',productPrice=Number(p.get('price'))||0;document.getElementById('productName').textContent=productName;document.getElementById('productPrice').textContent=productPrice.toLocaleString('en-IN');document.getElementById('productImage').src=p.get('image')||'';function getQty(){let q=parseInt(quantity.value)||1;q=Math.max(1,Math.min(20,q));quantity.value=q;return q}function changeQty(v){quantity.value=getQty()+v;getQty();updateTotal()}function updateTotal(){total.textContent=(productPrice*getQty()).toLocaleString('en-IN')}quantity.addEventListener('input',updateTotal);updateTotal();function placeOrder(){const n=name.value.trim(),m=mobile.value.trim(),a=address.value.trim();if(!n||!m||!a){error.textContent='Please fill in your name, mobile number and delivery address.';error.style.display='block';return}if(!/^[0-9]{10}$/.test(m)){error.textContent='Please enter a valid 10-digit mobile number.';error.style.display='block';return}error.style.display='none';const q=getQty(),t=productPrice*q;localStorage.setItem('urbanDudeLatestOrder',JSON.stringify({product:productName,price:productPrice,quantity:q,total:t,customer:n,mobile:m,address:a,date:new Date().toLocaleString()}));successText.textContent='Hello '+n+'! Your order for '+q+' × '+productName+' has been placed successfully. Your product will be delivered to the address you provided.';successPopup.style.display='flex'}function closePopup(){successPopup.style.display='none';location.href='shop.html'}</script></body></html>
